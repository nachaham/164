<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제스처 드로잉 타이머</title>
<style>
:root{--bg:#121316;--panel:#1c1e23;--line:#2c2f36;--text:#e6e8ec;--dim:#8b909b;--acc:#6aa8ff;--warn:#ffb454}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column}
header{padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
button,select,input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button{cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#07101f;border-color:var(--acc);font-weight:700}
button.on{border-color:var(--acc);color:var(--acc)}
#setup{padding:12px;overflow:auto;flex:1;max-width:760px;width:100%;margin:0 auto}
#drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;color:var(--dim)}
#drop.over{border-color:var(--acc);color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.row label.t{width:100%;color:var(--dim);font-size:13px}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#07101f;border-color:var(--acc);font-weight:700}
.chk{display:flex;align-items:center;gap:6px}
#thumbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
#thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px}
#count{color:var(--dim);margin-top:6px}
#stage{display:none;flex:1;min-height:0;flex-direction:column}
body.running #stage{display:flex}
body.running #setup{display:none}
#view{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
#img{max-width:100%;max-height:100%;object-fit:contain}
#img.flip{transform:scaleX(-1)}
#img.gray{filter:grayscale(1)}
#breakBox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,11,14,.92);font-size:28px}
#breakBox.show{display:flex}
#hud{padding:8px 12px;border-top:1px solid var(--line);background:var(--bg)}
#top{display:flex;justify-content:space-between;color:var(--dim);font-size:14px}
#clock{font-size:clamp(44px,12vw,84px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#clock.low{color:var(--warn)}
#bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
#fill{height:100%;width:0;background:var(--acc)}
#ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#ctl button{flex:1 1 70px}
.kbd{color:var(--dim);font-size:12px;text-align:center;margin-top:6px}
</style>
</head>
<body>
<header><h1>제스처 드로잉 타이머</h1></header>

<section id="setup">
  <div id="drop">
    <p>여기에 참고 이미지를 끌어다 놓거나</p>
    <button id="pick" type="button">이미지 선택</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="count">선택된 이미지 없음</div>
    <div id="thumbs"></div>
  </div>

  <div class="row"><label class="t">간격</label><span id="presets"></span>
    <span class="chk"><input id="custom" type="number" min="5" max="7200" placeholder="직접(초)" style="width:110px" aria-label="직접 입력 초"></span>
  </div>
  <div class="row"><label class="t">쉬는 시간</label>
    <label class="chk">매 <input id="brkN" type="number" min="0" max="999" value="0" style="width:70px"> 장마다</label>
    <label class="chk"><input id="brkS" type="number" min="5" max="3600" value="30" style="width:80px"> 초 쉬기 (0장 = 사용 안 함)</label>
  </div>
  <div class="row"><label class="t">옵션</label>
    <label class="chk"><input id="shuffle" type="checkbox"> 섞기</label>
    <label class="chk"><input id="flip" type="checkbox"> 좌우반전</label>
    <label class="chk"><input id="gray" type="checkbox"> 흑백</label>
    <label class="chk"><input id="beep" type="checkbox" checked> 알림음</label>
  </div>
  <div class="row"><button id="start" class="primary" type="button" disabled>시작</button></div>
</section>

<section id="stage">
  <div id="view"><img id="img" alt="레퍼런스"><div id="breakBox"><div>쉬는 시간</div><div id="breakT" style="font-size:48px"></div></div></div>
  <div id="hud">
    <div id="top"><span id="idx">0 / 0</span><span id="total">총 00:00</span></div>
    <div id="clock">0:00</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="ctl">
      <button id="prev" type="button">이전</button>
      <button id="pause" type="button" class="primary">일시정지</button>
      <button id="skip" type="button">다음</button>
      <button id="bFlip" type="button">반전</button>
      <button id="bGray" type="button">흑백</button>
      <button id="stop" type="button">종료</button>
    </div>
    <div class="kbd">Space 일시정지 · → 다음 · ← 이전 · F 반전 · G 흑백</div>
  </div>
</section>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY='gestureTimer.v1';
  var PRESETS=[[30,'30초'],[60,'1분'],[120,'2분'],[300,'5분'],[600,'10분']];
  var S={interval:60,shuffle:false,flip:false,gray:false,beep:true,brkN:0,brkS:30};
  try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o)for(var k in o)if(k in S)S[k]=o[k];}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

  var files=[],order=[],urls=[],pos=0;
  var left=0,dur=0,paused=false,onBreak=false,sessionMs=0,last=0,timerId=null,shown=0;
  var actx=null;

  // presets UI
  var ph=$('presets');
  PRESETS.forEach(function(p){var c=document.createElement('span');c.className='chip';c.textContent=p[1];c.dataset.s=p[0];
    c.onclick=function(){S.interval=p[0];$('custom').value='';save();renderPresets()};ph.appendChild(c)});
  function renderPresets(){var isPre=false;[].forEach.call(ph.children,function(c){var on=+c.dataset.s===S.interval&&!$('custom').value;c.classList.toggle('on',on);if(on)isPre=true});}
  $('custom').addEventListener('input',function(){var v=parseInt(this.value,10);if(v>=5){S.interval=Math.min(v,7200);save()}renderPresets()});
  ['shuffle','flip','gray','beep'].forEach(function(k){var e=$(k);e.checked=!!S[k];e.onchange=function(){S[k]=e.checked;save();applyFx()}});
  $('brkN').value=S.brkN;$('brkS').value=S.brkS;
  $('brkN').onchange=function(){S.brkN=Math.max(0,parseInt(this.value,10)||0);save()};
  $('brkS').onchange=function(){S.brkS=Math.max(5,parseInt(this.value,10)||30);save()};
  if(!PRESETS.some(function(p){return p[0]===S.interval}))$('custom').value=S.interval;
  renderPresets();

  // files
  function addFiles(list){
    var arr=[].filter.call(list,function(f){return /^image\//.test(f.type)});
    if(!arr.length)return;
    files=files.concat(arr);
    arr.forEach(function(f){var u=URL.createObjectURL(f);urls.push(u)});
    renderThumbs();
  }
  function renderThumbs(){
    $('count').textContent=files.length?files.length+'장 선택됨':'선택된 이미지 없음';
    var t=$('thumbs');t.innerHTML='';
    urls.slice(0,60).forEach(function(u){var i=new Image();i.src=u;t.appendChild(i)});
    $('start').disabled=!files.length;
  }
  $('pick').onclick=function(){$('file').click()};
  $('file').onchange=function(){addFiles(this.files);this.value=''};
  var d=$('drop');
  ['dragenter','dragover'].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();d.classList.add('over')})});
  ['dragleave','drop'].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();d.classList.remove('over')})});
  d.addEventListener('drop',function(e){addFiles(e.dataTransfer.files)});
  window.addEventListener('dragover',function(e){e.preventDefault()});
  window.addEventListener('drop',function(e){e.preventDefault()});

  function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
  function fmtT(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,p=function(n){return n<10?'0'+n:n};return (h?h+':':'')+p(m)+':'+p(r)}

  function beep(){
    if(!S.beep)return;
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      var o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=880;g.gain.value=0.0001;
      o.connect(g);g.connect(actx.destination);
      var t=actx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.start(t);o.stop(t+0.3);
    }catch(e){}
  }
  function applyFx(){$('img').classList.toggle('flip',S.flip);$('img').classList.toggle('gray',S.gray);
    $('bFlip').classList.toggle('on',S.flip);$('bGray').classList.toggle('on',S.gray);
    $('flip').checked=S.flip;$('gray').checked=S.gray}

  function makeOrder(){
    order=files.map(function(_,i){return i});
    if(S.shuffle)for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}
  }
  function show(p,sound){
    pos=p;onBreak=false;$('breakBox').classList.remove('show');
    $('img').src=urls[order[pos]];
    dur=left=S.interval;
    $('idx').textContent=(pos+1)+' / '+order.length;
    if(sound)beep();
    render();
  }
  function startBreak(){
    onBreak=true;dur=left=Math.max(5,S.brkS);
    $('breakBox').classList.add('show');beep();render();
  }
  function next(){
    if(onBreak){ if(pos+1>=order.length)return finish(); show(pos+1,true); return}
    var shownCount=pos+1;
    if(S.brkN>0&&shownCount%S.brkN===0&&pos+1<order.length){startBreak();return}
    if(pos+1>=order.length){finish();return}
    show(pos+1,true);
  }
  function prev(){ if(onBreak){show(pos,true);return} if(pos>0)show(pos-1,true);else show(0,false)}
  function finish(){
    beep();stop();alert('세션 완료! 총 '+fmtT(sessionMs));
  }
  function render(){
    $('clock').textContent=fmt(left);
    $('clock').classList.toggle('low',left<=5);
    $('breakT').textContent=fmt(left);
    $('fill').style.width=(dur?(1-left/dur)*100:0)+'%';
    $('total').textContent='총 '+fmtT(sessionMs);
    $('pause').textContent=paused?'계속':'일시정지';
  }
  function tick(){
    var now=performance.now(),dt=now-last;last=now;
    if(paused)return;
    sessionMs+=dt;left-=dt/1000;
    if(left<=0)next();
    render();
  }
  function start(){
    if(!files.length)return;
    makeOrder();sessionMs=0;paused=false;
    document.body.classList.add('running');
    applyFx();
    show(0,true); // user gesture: unlocks audio
    last=performance.now();
    clearInterval(timerId);timerId=setInterval(tick,100);
  }
  function stop(){clearInterval(timerId);timerId=null;document.body.classList.remove('running')}
  function togglePause(){paused=!paused;last=performance.now();render()}
  $('start').onclick=start;
  $('stop').onclick=stop;
  $('pause').onclick=togglePause;
  $('skip').onclick=next;
  $('prev').onclick=prev;
  $('bFlip').onclick=function(){S.flip=!S.flip;save();applyFx()};
  $('bGray').onclick=function(){S.gray=!S.gray;save();applyFx()};
  document.addEventListener('keydown',function(e){
    if(!document.body.classList.contains('running'))return;
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    var k=e.key;
    if(k===' '){e.preventDefault();togglePause()}
    else if(k==='ArrowRight'){next()}
    else if(k==='ArrowLeft'){prev()}
    else if(k==='f'||k==='F'){S.flip=!S.flip;save();applyFx()}
    else if(k==='g'||k==='G'){S.gray=!S.gray;save();applyFx()}
  });
  document.addEventListener('keyup',function(e){if(e.key===' '&&document.body.classList.contains('running'))e.preventDefault()});
  applyFx();
})();
</script>
</body>
</html>
